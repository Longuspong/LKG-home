<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Logo Landeskirchliche Gemeinschaft Limbach-Oberfrohna</title>
  <!-- Farbige Variante (z.B. fuer Favicon / helle Flaechen):
       dunkle Tuerfluegel, weisses Kreuz, tuerkis + gelbe Akzente. -->
  <!-- linker Tuerfluegel -->
  <polygon points="28,10 54,10 54,118 10,118 10,28" fill="#3d6e7a"/>
  <!-- rechter Tuerfluegel -->
  <polygon points="66,10 110,10 110,100 92,118 66,118" fill="#3d6e7a"/>
  <!-- Tuerkis-Akzente (oben links / unten rechts) -->
  <polygon points="10,10 28,10 10,28" fill="#7fc1cc"/>
  <polygon points="110,118 92,118 110,100" fill="#7fc1cc"/>
  <!-- Gelbe Akzente (oben Mitte / unten Mitte) -->
  <polygon points="66,10 82,10 66,26" fill="#f2ca3f"/>
  <polygon points="54,118 38,118 54,102" fill="#f2ca3f"/>
  <!-- weisses Kreuz obenauf -->
  <rect x="54" y="10" width="12" height="108" fill="#ffffff"/>
  <rect x="10" y="40" width="100" height="12" fill="#ffffff"/>
</svg>
